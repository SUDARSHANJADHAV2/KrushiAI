<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krushi AI - Chatbot Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2d5a27;
            --secondary-green: #4a7c59;
            --accent-green: #6ab04c;
            --light-green: #7bed9f;
            --dark-green: #1e3a1a;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --dark-gray: #343a40;
            --border-color: rgba(45, 90, 39, 0.15);
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --gradient-green: linear-gradient(135deg, #2d5a27, #4a7c59, #6ab04c);
            --font-main: 'Poppins', sans-serif;
            --font-text: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            border: none;
        }

        body {
            font-family: var(--font-text);
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: var(--dark-gray);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1.5" fill="%232d5a27" opacity="0.05"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grain)"/></svg>');
            pointer-events: none;
            z-index: 0;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px var(--shadow);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--light-gray);
            color: var(--primary-green);
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #e2e6ea;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(45, 90, 39, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: var(--font-main);
            background: var(--gradient-green);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-family: var(--font-main);
            color: var(--secondary-green);
            font-weight: 500;
            background: rgba(123, 237, 159, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 50px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(106, 176, 76, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(106, 176, 76, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(106, 176, 76, 0); }
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
            padding: 2rem;
            z-index: 5;
        }

        .chat-app {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px var(--shadow-hover);
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 85%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .message.bot .message-icon {
            background: var(--gradient-green);
            color: var(--white);
        }

        .message.user .message-icon {
            background: var(--light-gray);
            border: 1px solid var(--border-color);
            color: var(--primary-green);
        }

        .message-content {
            padding: 1rem 1.2rem;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 2px 8px var(--shadow);
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: var(--white);
            color: var(--dark-gray);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .message.user .message-content {
            background: var(--gradient-green);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }

        /* Typing Indicator Styling */
        .typing-indicator {
            display: none;
            gap: 6px;
            padding: 1.2rem;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary-green);
            opacity: 0.6;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input Area */
        .input-container {
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 1.2rem 1.5rem;
            padding-right: 3rem;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            font-size: 1rem;
            font-family: var(--font-text);
            color: var(--dark-gray);
            background: var(--white);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        #messageInput:focus {
            border-color: var(--secondary-green);
            box-shadow: 0 0 0 4px rgba(74, 124, 89, 0.1);
        }

        #messageInput::placeholder {
            color: var(--medium-gray);
        }

        #sendButton {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--gradient-green);
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(45, 90, 39, 0.3);
        }

        #sendButton svg {
            width: 22px;
            height: 22px;
            transform: translateX(-1px) translateY(1px); /* Slight optical alignment */
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45, 90, 39, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            background: var(--medium-gray);
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar { width: 8px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover { background: var(--secondary-green); }

        /* Responsiveness */
        @media (max-width: 768px) {
            .header { padding: 1rem 5%; }
            .logo-text { font-size: 1.4rem; }
            .main-wrapper { padding: 1rem; }
            .chat-app { border-radius: 12px; height: 100%; top: 0; }
            .message { max-width: 95%; }
            .input-container { padding: 1rem; }
            #messageInput { padding: 1rem 1.2rem; }
            #sendButton { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="../index.html" class="back-btn" title="Back to Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <a href="../index.html" class="logo">
                <span class="logo-icon">🌾</span>
                <span class="logo-text">KrushiAI</span>
            </a>
        </div>
        <div class="status">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="chat-app">
            <div class="chat-container" id="chatContainer">
                <div class="message bot">
                    <div class="message-icon">🤖</div>
                    <div class="message-content">
                        Hello! I'm your KrushiAI Smart Farming Assistant. How can I help you improve your yields today?
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Ask about crops, diseases, weather..."
                        autocomplete="off"
                    />
                </div>
                <button id="sendButton">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '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';
        const API_URL = 'http://localhost:8001/api/chat';
        
        console.log('API configured and ready');

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        let conversationHistory = [];

        // Function to format text (basic markdown for bold and lists)
        function formatMessageContent(text) {
            // Replace bold text **bold**
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Handle bullet points
            formatted = formatted.replace(/- (.*?)(\n|$)/g, '<li>$1</li>');
            // Wrap list items in ul if they exist
            if (formatted.includes('<li>')) {
                // A very basic wrapping approach for simple lists
                formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul style="margin-left: 20px; margin-top: 8px;">$1</ul>');
            }
            // Add paragraphs for double line breaks
            formatted = formatted.replace(/\n\n/g, '<br><br>');
            return formatted;
        }

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const iconDiv = document.createElement('div');
            iconDiv.className = 'message-icon';
            iconDiv.innerHTML = isUser ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isUser) {
                contentDiv.textContent = content; // pure text for user
            } else {
                contentDiv.innerHTML = formatMessageContent(content); // formatted HTML for bot
            }
            
            messageDiv.appendChild(iconDiv);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            scrollToBottom();
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            
            const iconDiv = document.createElement('div');
            iconDiv.className = 'message-icon';
            iconDiv.textContent = '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.style.padding = "0.8rem 1.2rem";
            
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'typing-indicator active';
            indicatorDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            contentDiv.appendChild(indicatorDiv);
            typingDiv.appendChild(iconDiv);
            typingDiv.appendChild(contentDiv);
            chatContainer.appendChild(typingDiv);
            
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
        
        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            sendButton.disabled = true;

            conversationHistory.push({
                role: 'user',
                content: message
            });

            showTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'meta/llama-3.1-8b-instruct',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are Krushi AI, a helpful, polite, and advanced assistant specialized in farming and agriculture. Provide practical, accurate, and structured advice to farmers. Use markdown bolding and bullet points to format your responses cleanly.'
                            },
                            ...conversationHistory
                        ],
                        temperature: 0.7,
                        max_tokens: 1000
                    })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    const errorData = await response.text();
                    console.error('API Error:', response.status, errorData);
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('Invalid API response structure');
                }
                
                const aiMessage = data.choices[0].message.content;

                conversationHistory.push({
                    role: 'assistant',
                    content: aiMessage
                });

                addMessage(aiMessage, false);

            } catch (error) {
                removeTypingIndicator();
                console.error('Full Error Details:', error);
                
                let errorMessage = 'Sorry, I encountered an error communicating with my brain. ';
                if (error.message.includes('401')) {
                    errorMessage += 'API authentication failed.';
                } else if (error.message.includes('429')) {
                    errorMessage += 'Too many requests. Please wait a moment.';
                } else {
                    errorMessage += 'Please make sure my backend proxy is running via python server.py!';
                }
                
                addMessage(errorMessage, false);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        messageInput.focus();
    </script>
</body>
</html>
