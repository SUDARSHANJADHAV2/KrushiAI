<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Consultant - KrushiAI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2B593F;
            --secondary-color: #4E8752;
            --accent-color: #A3C940;
            --bg-color: #F9FAF7;
            --surface-color: #FFFFFF;
            --text-primary: #1A2B22;
            --text-muted: #5C7362;
            --border-color: #E1E8E3;
            
            --success: #16A34A;
            --error: #DC2626;

            --font-headings: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;

            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-float: 0 20px 40px -10px rgba(43, 89, 63, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; /* Prevent body scrolling so chat flex takes over */ }
        a { text-decoration: none; color: inherit; }
        
        .container { max-width: 1280px; margin: 0 auto; width: 100%; padding: 0 5%; }
        
        /* Navigation (Condensed for app view) */
        .header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .logo { display: flex; align-items: center; gap: 8px; color: var(--primary-color); font-family: var(--font-headings); font-size: 1.5rem; font-weight: 800; }
        .logo i { color: var(--accent-color); font-size: 1.5rem; }
        .back-link { font-family: var(--font-headings); font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .back-link:hover { color: var(--primary-color); }

        /* Chat Layout */
        .chat-app {
            display: flex;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            margin: 80px auto 20px;
            max-width: 1000px;
            height: calc(100vh - 100px);
            box-shadow: var(--shadow-float);
            overflow: hidden;
        }

        .chat-sidebar {
            width: 280px;
            background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            margin-bottom: 24px;
        }
        .sidebar-header h2 { font-family: var(--font-headings); font-size: 1.25rem; color: var(--primary-color); }
        .sidebar-header p { font-size: 0.85rem; color: var(--text-muted); }

        .suggested-prompts { display: flex; flex-direction: column; gap: 8px; }
        .prompt-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            text-align: left;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .prompt-btn:hover {
            border-color: var(--accent-color);
            background: rgba(163, 201, 64, 0.05);
            transform: translateY(-2px);
        }
        .prompt-btn i { color: var(--primary-color); font-size: 1.25rem; }

        /* Main Chat Area */
        .chat-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface-color);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ai-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem;
        }
        .ai-info h3 { font-size: 1.1rem; margin-bottom: 0; }
        .ai-info span { font-size: 0.8rem; color: var(--success); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .ai-info span::before { content: ''; width: 6px; height: 6px; background: var(--success); border-radius: 50%; }

        .chat-messages {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 85%;
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }

        .msg-icon {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .message.bot .msg-icon { background: var(--primary-color); color: white; }
        .message.user .msg-icon { background: var(--bg-color); color: var(--primary-color); border: 1px solid var(--border-color); }

        .msg-bubble {
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            line-height: 1.5;
        }
        .message.bot .msg-bubble { background: var(--bg-color); color: var(--text-primary); border-top-left-radius: 4px; border: 1px solid var(--border-color); }
        .message.user .msg-bubble { background: var(--primary-color); color: white; border-top-right-radius: 4px; }

        .msg-bubble strong { color: inherit; font-weight: 700; }
        .msg-bubble ul { margin-left: 20px; margin-top: 8px; margin-bottom: 8px;}
        .message.bot .msg-bubble ul li { margin-bottom: 4px; }

        /* Input Area */
        .chat-input-container {
            padding: 20px 24px;
            background: var(--surface-color);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 8px 16px;
            transition: all 0.3s;
        }
        .chat-input-wrapper:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(43, 89, 63, 0.1); background: var(--surface-color); }

        .chat-input-wrapper input {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 12px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            color: var(--text-primary);
        }

        .btn-send {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-send:hover:not(:disabled) { background: var(--secondary-color); transform: scale(1.05); }
        .btn-send:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        /* Typing indicator */
        .typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
        .typing-dot { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        @media (max-width: 768px) {
            .chat-sidebar { display: none; }
            .chat-app { margin: 60px 0 0; height: calc(100vh - 60px); border-radius: 0; border: none;}
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Hub</a>
        <a href="../index.html" class="logo">
            <i class="fas fa-leaf"></i> KrushiAI
        </a>
    </header>

    <div class="chat-app">
        <!-- Sidebar -->
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <h2>AI Capabilities</h2>
                <p>Select a quick prompt or type your custom inquiry.</p>
            </div>
            <div class="suggested-prompts">
                <button class="prompt-btn" onclick="document.getElementById('messageInput').value='What are the initial signs of leaf blight?'; sendMessage();">
                    <i class="fas fa-leaf"></i> <span>Detect Early Leaf Blight</span>
                </button>
                <button class="prompt-btn" onclick="document.getElementById('messageInput').value='How to lower soil pH safely?'; sendMessage();">
                    <i class="fas fa-flask"></i> <span>Soil pH Adjustments</span>
                </button>
                <button class="prompt-btn" onclick="document.getElementById('messageInput').value='Best fertilizer for flowering stage of tomatoes?'; sendMessage();">
                    <i class="fas fa-seedling"></i> <span>Tomato Fertilization</span>
                </button>
                <button class="prompt-btn" onclick="document.getElementById('messageInput').value='How often should I water during drought scenarios?'; sendMessage();">
                    <i class="fas fa-droplet"></i> <span>Drought Irrigation</span>
                </button>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="ai-avatar"><i class="fas fa-robot"></i></div>
                <div class="ai-info">
                    <h3>KrushiAI Virtual Agronomist</h3>
                    <span>Online & Ready</span>
                </div>
            </div>

            <div class="chat-messages" id="chatContainer">
                <!-- Initial Welcome -->
                <div class="message bot">
                    <div class="msg-icon"><i class="fas fa-robot"></i></div>
                    <div class="msg-bubble">
                        Hello! I am your personal KrushiAI Virtual Agronomist. How can I assist you with your farming operations today?
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" id="messageInput" placeholder="Ask about crops, soils, diseases, or weather..." autocomplete="off">
                    <button id="sendButton" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:8001/api/chat';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        let conversationHistory = [];

        function formatMessageContent(text) {
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/- (.*?)(\n|$)/g, '<li>$1</li>');
            if (formatted.includes('<li>')) {
                formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            }
            formatted = formatted.replace(/\n\n/g, '<br><br>');
            return formatted;
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function addMessage(content, isUser = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${isUser ? 'user' : 'bot'}`;

            const iconHtml = isUser ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            const contentHtml = isUser ? content : formatMessageContent(content); // User is raw text

            wrapper.innerHTML = `
                <div class="msg-icon">${iconHtml}</div>
                <div class="msg-bubble">${contentHtml}</div>
            `;
            
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function showTyping() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message bot';
            wrapper.id = 'typingIndicator';
            wrapper.innerHTML = `
                <div class="msg-icon"><i class="fas fa-robot"></i></div>
                <div class="msg-bubble">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function removeTyping() {
            const ind = document.getElementById('typingIndicator');
            if (ind) ind.remove();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            sendButton.disabled = true;

            conversationHistory.push({ role: 'user', content: message });
            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'meta/llama-3.1-8b-instruct',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are Krushi AI, a helpful, polite, and advanced assistant specialized in farming and agriculture. Provide practical, accurate, and structured advice to farmers. Use markdown bolding and bullet points to format your responses cleanly.'
                            },
                            ...conversationHistory
                        ],
                        temperature: 0.7,
                        max_tokens: 1000
                    })
                });

                removeTyping();

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('Invalid Architecture');
                }
                
                const aiMessage = data.choices[0].message.content;
                conversationHistory.push({ role: 'assistant', content: aiMessage });
                
                addMessage(aiMessage, false);

            } catch (error) {
                removeTyping();
                console.error(error);
                
                let errorMessage = 'Sorry, I encountered an error communicating with my brain. ';
                if (error.message.includes('401')) errorMessage += 'API authentication failed.';
                else if (error.message.includes('429')) errorMessage += 'Too many requests. Please wait a moment.';
                else errorMessage += 'Please make sure my backend proxy is running via python server.py!';
                
                addMessage(errorMessage, false);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        // Make sure elements exist before attaching listeners
        document.addEventListener('DOMContentLoaded', () => {
            const sendBtn = document.getElementById('sendButton');
            const msgInput = document.getElementById('messageInput');
            
            if(sendBtn && msgInput) {
                sendBtn.addEventListener('click', sendMessage);
                msgInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
            }
        });
        
    </script>
</body>
</html>
